<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Operator — Church Translator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;900&display=swap" media="print" onload="this.media='all'">
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/css/styles.css">
  <meta name="theme-color" content="#0F0F0F">
</head>
<body>
  <div class="container">
    <h1>Operator Panel</h1>

    <div id="status" class="status status-idle">Connecting...</div>

    <div class="card">
      <label for="language-select">Broadcast language</label>
      <select id="language-select" class="select">
        <option value="es">Español</option>
        <option value="en">English</option>
        <option value="pt">Português</option>
        <option value="fr">Français</option>
        <option value="de">Deutsch</option>
        <option value="it">Italiano</option>
        <option value="ru">Русский</option>
        <option value="zh">中文</option>
        <option value="ja">日本語</option>
        <option value="ko">한국어</option>
        <option value="hi">हिन्दी</option>
        <option value="id">Bahasa Indonesia</option>
        <option value="vi">Tiếng Việt</option>
      </select>
      <p class="hint">The sermon's language is detected automatically.</p>
    </div>

    <div class="card">
      <label>Audio level</label>
      <div class="audio-level-container">
        <div id="audio-level" class="audio-level-bar"></div>
      </div>
      <div id="vad-indicator" class="vad-status vad-silent">Silent (paused)</div>
    </div>

    <div class="btn-group">
      <button id="start-btn" class="btn-success" disabled>Start</button>
      <button id="stop-btn" class="btn-danger" disabled>Stop</button>
    </div>

    <div class="info-row">
      <span>People listening:</span>
      <span id="listener-count">0</span>
    </div>
  </div>

  <script src="/js/nosleep.min.js"></script>
  <script type="module" src="/js/operator.js"></script>
</body>
</html>
